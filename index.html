<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobFilter | Secure your opportunities.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Navbar */
        .navbar-custom {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        }

        .navbar .nav-link {
            color: #fff !important;
            margin-left: 1rem;
        }

        .navbar-brand img {
            height: 28px;
            margin-right: 10px;
            vertical-align: middle;
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            height: 60vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .hero-section video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: -1;
            }

        .hero-content {
            position: relative;
            color: #fff;
            text-align: center;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .hero-text {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background-color: #6c63ff;
            border-color: #6c63ff;
        }

            .btn-primary:hover {
                background-color: #5848d2;
                border-color: #5848d2;
            }

        /* Info Section */
        .info-section {
            padding: 4rem 2rem;
            background-color: #fff;
            text-align: center;
        }

            .info-section h2 {
                color: #333;
                margin-bottom: 1rem;
            }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

            .hero-text {
                font-size: 1rem;
            }

            .navbar .nav-link {
                margin-left: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
                <img src="assets/images/jobfilter-icon.png" alt="JobFilter Logo">
                JobFilter
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Video Background -->
    <section class="hero-section">
        <video autoplay muted loop>
            <source src="assets/videos/background.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="hero-content">
            <h1 class="hero-title">Welcome to JobFilter</h1>
            <p class="hero-text">Your smart tool for filtering job applications and matching the right skills.</p>
            <a href="login.html" class="btn btn-primary btn-lg">Get Started</a>
        </div>
    </section>

    <!-- Info Section -->
    <section class="info-section">
        <h2>Why Choose JobFilter?</h2>
        <p>We make hiring easier by automating the screening process and matching candidates to roles based on their skills.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
