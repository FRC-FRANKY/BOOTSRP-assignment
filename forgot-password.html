<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/forgot-password.css" rel="stylesheet">
</head>
<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="forgot-password-wrapper">

            <!-- Logo Above Card -->
            <div class="logo-wrapper mb-3 text-center">
                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/2c02782c-fef2-4fee-a2ef-038b6d584a47/dkdsr7s-01ab50cd-7fc4-4c4f-8d93-ae0b831db0ed.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzJjMDI3ODJjLWZlZjItNGZlZS1hMmVmLTAzOGI2ZDU4NGE0N1wvZGtkc3I3cy0wMWFiNTBjZC03ZmM0LTRjNGYtOGQ5My1hZTBiODMxZGIwZWQucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.ZM5-1wj3Tuwx8OHvftgeyNlP5Ysph0qy4zSzgJl9jw4"
                     alt="Brand Logo" class="brand-banner" />
            </div>

            <!-- Forgot Password Card -->
            <div class="card shadow-sm forgot-password-card">
                <div class="card-header border-0 pt-4 pb-0 text-center">
                    <h5 class="mb-0">Forgot Password</h5>
                    <p class="text-muted mb-0 mt-2">Enter your email to reset your password.</p>
                </div>
                <div class="card-body">

                    <div id="resetMessage" class="alert alert-info d-none py-2 mb-3 small" role="alert">
                        We'll send you a password reset link if an account exists with that email.
                    </div>

                    <form class="needs-validation" novalidate action="#" method="post" autocomplete="on">

                        <!-- Email -->
                        <div class="mb-3 text-start">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="Enter your email address"
                                   required
                                   aria-describedby="emailHelp" />
                            <div id="emailHelp" class="form-text">We'll send a password reset link to this email.</div>
                            <div class="invalid-feedback">
                                Please enter a valid email address.
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" type="submit">Send Reset Link</button>
                        </div>

                        <!-- Back to login link -->
                        <div class="mt-3 text-start">
                            <a href="login.html" class="text-decoration-none">← Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
